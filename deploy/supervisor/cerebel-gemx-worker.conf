; Warm GEM-X worker (127.0.0.1:61017) for a GPU box that runs analyses itself
; (CEREBEL_GPU_BACKEND unset or "local"). Not needed when CEREBEL_GPU_BACKEND=modal.
;
; Without this the worker only runs if someone starts it by hand, and it is gone after every
; machine restart: uploads then wait 10 minutes and fail with "[Errno 111] Connection refused".
;
; Install once (as root):
;   cp /root/CerebelServer/deploy/supervisor/cerebel-gemx-worker.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;   supervisorctl status cerebel-gemx-worker
; Models take about 2 minutes to load; /api/health shows "gpu": {"state": "ready"} after that.
; Restart after changing gemx_warm_worker.py: supervisorctl restart cerebel-gemx-worker
; Do not also start the worker with run.sh / run-daemon.sh: two copies would both load models.

[program:cerebel-gemx-worker]
command=bash -lc 'exec /root/GEM-X/.venv/bin/python -u /root/CerebelServer/gemx_warm_worker.py'
directory=/root/CerebelServer
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=5
; Start before cerebel-product (default priority 999) so the first upload finds it loading.
priority=100
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/root/CerebelServer/gemx_worker.log
redirect_stderr=true
user=root
