; Daily data retention (the deletions promised in the privacy policy) for the GPU box, which has
; supervisord but no cron and no systemd. Supervisor only keeps the loop alive; the loop
; (motion_agent/app/retention_schedule.py) runs `python -m motion_agent.app.retention` once a day
; at CEREBEL_RETENTION_AT (UTC, default 07:41) and catches up a run missed while the box was off.
; With no earlier run in data/product/retention.jsonl, the first run waits for that time.
; The US droplet uses deploy/us/cerebel-retention.timer and the Mac launchd; do not install this there.
;
; Install once (as root). `update cerebel-retention` touches only this program:
;   cp /root/CerebelServer/deploy/supervisor/cerebel-retention.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update cerebel-retention
;   supervisorctl status cerebel-retention
; Preview what the next run deletes (ids and counts only):
;   cd /root/CerebelServer && bash -lc 'set -a; source .env.product; set +a; python3 -m motion_agent.app.retention --dry-run'
; Last and next run: same, with `python3 -m motion_agent.app.retention_schedule --next`
; What each run did: data/product/retention.jsonl (ids and counts) and retention.log.

[program:cerebel-retention]
command=bash -lc 'set -a; source /root/CerebelServer/.env.product; set +a; exec python3 -u -m motion_agent.app.retention_schedule'
directory=/root/CerebelServer
autostart=true
autorestart=true
startsecs=5
startretries=5
; A run in progress is stopped with the loop; it is safe to stop part-way, the next run continues.
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/root/CerebelServer/retention.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
user=root
