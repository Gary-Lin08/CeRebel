; Live playground for cerebel.tech/playground — serves /root/CeRebel (this repo's UI).
; Secrets and shared session data still come from CerebelServer/.env.product
; (CEREBEL_DATA_DIR / CEREBEL_SESSIONS_DIR / Stripe / LLM).
;
; Install / refresh:
;   cp /root/CeRebel/deploy/supervisor/cerebel-product.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update cerebel-product
;   supervisorctl status cerebel-product

[program:cerebel-product]
command=bash -lc 'set -a; source /root/CerebelServer/.env.product; set +a; exec python3 -u -m motion_agent.app.chat_server'
directory=/root/CeRebel
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/root/CeRebel/product_server.log
stderr_logfile=/root/CeRebel/product_server.log
user=root
